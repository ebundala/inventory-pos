version: "3.9"

services:
  db:
    image: ${POSTGRES_TAG}
    
    volumes:
      - PGDATA:/var/lib/postgresql/data
    networks:
      webnet:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: ${PGDATA}
    deploy:
      replicas: 1
      resources:
        limits:
          # cpus: 0.3
          memory: 1g
      restart_policy:
        condition: on-failure
  studio:
    image: ghcr.io/ebundala/inventory-pos/studio:main 
          
    networks:
      webnet:
    environment:
      DATABASE_URL: ${DATABASE_URL}
    deploy:
      replicas: 1
      resources:
        limits:  
          # cpus: 0.05       
          memory: 250m
      restart_policy:
        condition: on-failure
  app:
    image: ghcr.io/ebundala/inventory-pos/server:main       
    environment:
       NODE_ENV: ${NODE_ENV}
       NEXT_PUBLIC_HOST: ${NEXT_PUBLIC_HOST}
       NEXT_PUBLIC_CLOUD_NAME: ${NEXT_PUBLIC_CLOUD_NAME}
       NEXT_PUBLIC_CLOUD_PREFIX: ${NEXT_PUBLIC_CLOUD_PREFIX}
     # google credentials
       GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
       GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
     
      #database 
       DATABASE_URL: ${DATABASE_URL}
       DATABASE_USER_URL: ${DATABASE_USER_URL}
      #Next Auth
       NEXTAUTH_URL: ${NEXTAUTH_URL}
       APP_HOST: ${APP_HOST}
       NEXTAUTH_SECRET:  ${NEXTAUTH_SECRET}
       #JACKSON
       DB_ENCYPTION_KEY: ${DB_ENCYPTION_KEY}
       OPENID_RSA_PRIVATE_KEY: ${OPENID_RSA_PRIVATE_KEY}
     
    depends_on:
      - db
     
    #     condition: service_healthy
    # ports:
    #   - ${APP_PORT}:3000
    volumes:
      # - ${PWD}/${GOOGLE_APPLICATION_CREDENTIALS}:/usr/src/app/${GOOGLE_APPLICATION_CREDENTIALS}
      - ./webserver/web-root/public:/usr/src/app/public
    networks:
      webnet:

    deploy:
      replicas: 1
      resources:
        limits:
          # cpus:  0.5
          memory: 1g
      restart_policy:
        condition: on-failure
  
  # redis:
  #   image: redis:alpine
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 1s
  #     timeout: 3s
  #     retries: 30
  #   networks:
  #     webnet:
  #   deploy:
  #     replicas: 1
  #     resources:
  #       limits: 
  #         # cpus: 0.05        
  #         memory: 250m
  #     restart_policy:
  #       condition: on-failure

  webserver:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
      - "5555:5555"
    volumes:
      - ./webserver/web-root:/var/www/html
      - ./webserver/nginx-conf:/etc/nginx/conf.d
      -  /etc/letsencrypt:/etc/letsencrypt
      - ./dhparam:/etc/ssl/certs
      - ./.env:/usr/src/app/.env
    networks:
      webnet:
    deploy:
      replicas: 1
      resources:
       limits:
        #  cpus: 0.1
         memory: 500mb
      restart_policy:
        condition: on-failure
        
networks:
  webnet:   
volumes:
  PGDATA:

