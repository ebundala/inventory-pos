version: "3.1"
networks:
  webnet:
volumes:
  PGDATA:
services:
  db:
    image: ${POSTGRES_TAG}
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - PGDATA:/var/lib/postgresql/data
    networks:
      webnet:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: ${PGDATA}
    # deploy:
    #   replicas: 1
    #   resources:
    #     limits:
    #       cpus: "1"
    #       memory: 1g
    #   restart_policy:
    #     condition: on-failure
  # redis:
  #   image: redis:alpine
  #   # ports:
  #   #   - 6379:6379
  #   networks:
  #     webnet:
    # deploy:
    #   replicas: 2
    #   update_config:
    #     parallelism: 2
    #     delay: 10s
    #   restart_policy:
    #     condition: on-failure
  app:
    image: ${NODE_TAG}
    working_dir: /home/app 
    command: yarn run dev
    depends_on:
      - db
      # - redis
    ports:
      - ${APP_PORT}:3000
      - 9229:9229 #debugger port disable in production
      - 5556:5555 #prisma studio disable in production
      - 9230:9230 #debugger port disable in production
    volumes:
      - ./:/home/app
    networks:
      webnet:

  #   deploy:
  #     replicas: 1
  #     # resources:
  #     #   limits:
  #     #     cpus: "1"
  #     #     memory: 1g
  #     restart_policy:
  #       condition: on-failure
  
  webserver:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./webserver/web-root:/var/www/html
      - ./webserver/nginx-conf/local.conf:/etc/nginx/conf.d/default.conf
      - ./keys/ssl/ebundala.dev.key:/etc/ssl/private/nginx-selfsigned.key
      - ./keys/ssl/ebundala.dev.crt:/etc/ssl/certs/nginx-selfsigned.crt
      # - /etc/ssl:/etc/ssl
      - /etc/nginx/dhparam.pem:/etc/nginx/dhparam.pem
    depends_on:
      - app
    networks:
      webnet:
    deploy:
      replicas: 1
      # resources:
      #  limits:
      #    cpus: "1"
      #    memory: 1g
      restart_policy:
        condition: on-failure
        
